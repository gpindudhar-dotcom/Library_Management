{% extends "base.html" %}
{% block title %}Edit Book - Library Book Management{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <h1 class="mb-4"><i class="bi bi-pencil-square text-primary"></i> Edit Book</h1>

    <div class="card">
      <div class="card-body p-4">
        <form method="post">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Book Title</label>
              <input type="text" name="title" class="form-control" value="{{ book['title'] }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Author Name</label>
              <input type="text" name="author" class="form-control" value="{{ book['author'] }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Category</label>
              <input type="text" name="category" class="form-control" value="{{ book['category'] }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Publisher</label>
              <input type="text" name="publisher" class="form-control" value="{{ book['publisher'] }}" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Year</label>
              <input type="number" name="year" class="form-control" value="{{ book['year'] }}" min="1900" max="2100" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">ISBN</label>
              <input type="text" name="isbn" class="form-control" value="{{ book['isbn'] }}" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Quantity</label>
              <input type="number" name="quantity" class="form-control" value="{{ book['quantity'] }}" min="1" required>
            </div>
          </div>
<div class="mt-4 d-flex gap-2">
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Save Changes</button>
            <button type="reset" class="btn btn-outline-secondary"><i class="bi bi-arrow-counterclockwise"></i> Reset</button>
            <a href="{{ url_for('search') }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
