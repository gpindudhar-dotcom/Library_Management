<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Registration | Kalpataru Institute of Technology Library</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="login-wrapper">
    <div class="card login-card border-0 shadow-lg">
      <div class="card-header bg-primary text-white text-center py-3">
        <i class="bi bi-person-plus-fill" style="font-size: 2.5rem;"></i>
        <h4 class="mt-2 mb-0">Create Admin Account</h4>
        <p class="small mb-0">Kalpataru Institute of Technology</p>
      </div>
      <div class="card-body p-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="post">
          <div class="mb-3">
            <label class="form-label"><i class="bi bi-person"></i> Full Name</label>
            <input type="text" name="name" class="form-control" placeholder="Enter your full name">
          </div>
          <div class="mb-3">
            <label class="form-label"><i class="bi bi-person-badge"></i> Username</label>
            <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
          </div>
          <div class="mb-3">
            <label class="form-label"><i class="bi bi-lock"></i> Password</label>
            <div class="input-group">
              <input type="password" name="password" id="password" class="form-control" placeholder="At least 4 characters" required>
              <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('password')">
                <i class="bi bi-eye" id="passwordIcon"></i>
              </button>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label"><i class="bi bi-shield-lock"></i> Confirm Password</label>
            <div class="input-group">
              <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="Re-enter your password" required>
              <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('confirm_password')">
                <i class="bi bi-eye" id="confirmPasswordIcon"></i>
              </button>
            </div>
          </div>
          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary"><i class="bi bi-check2-circle"></i> Register</button>
            <button type="reset" class="btn btn-outline-secondary"><i class="bi bi-arrow-counterclockwise"></i> Reset</button>
          </div>
        </form>
      </div>
      <div class="card-footer bg-light text-center small">
        Already have an account? <a href="{{ url_for('login') }}">Login</a>
      </div>
    </div>
  </div>

  <script>
    function togglePassword(id) {
      const input = document.getElementById(id);
      const icon = document.getElementById(id === 'password' ? 'passwordIcon' : 'confirmPasswordIcon');
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      icon.classList.toggle('bi-eye');
      icon.classList.toggle('bi-eye-slash');
    }
  </script>
</body>
</html>
